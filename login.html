```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMIGOS | Login Portal</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    min-height: 100vh;
    color: white;
    overflow-x: hidden;
}

#particles-js {
    position: fixed;
    inset: 0;
    z-index: -1;
}

/* TOP BAR */
.topbar {
    display: flex;
    justify-content: flex-start;
    align-items: center;
    padding: 13px 22px;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.12);
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 25px;
    font-weight: bold;
    letter-spacing: 2px;
    text-decoration: none;
    color: white;
    animation: glow 2s infinite alternate;
}

.logo img {
    height: 48px;
    width: 48px;
    object-fit: contain;
}

@keyframes glow {
    from {
        color: #00f7ff;
        text-shadow: 0 0 5px #00f7ff;
    }
    to {
        color: white;
        text-shadow: 0 0 20px #00f7ff;
    }
}

/* LOGIN CONTAINER */
.container {
    width: calc(100% - 32px);
    max-width: 420px;
    margin: 45px auto;
    background: rgba(255,255,255,0.10);
    padding: 28px;
    border-radius: 18px;
    backdrop-filter: blur(15px);
    box-shadow: 0 0 25px rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.15);
    animation: appear 0.7s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

h2 {
    text-align: center;
    margin-bottom: 22px;
    font-size: 27px;
    animation: glow 2s infinite alternate;
}

/* INPUT FIELDS */
input, select {
    display: block;
    width: 100%;
    height: 48px;
    padding: 0 14px;
    margin: 12px 0;
    border-radius: 9px;
    border: 1px solid rgba(255,255,255,0.3);
    outline: none;
    font-size: 15px;
    background: rgba(255,255,255,0.95);
    color: #12344a;
}

input:focus, select:focus {
    border: 2px solid #00e5ff;
    box-shadow: 0 0 10px rgba(0,247,255,0.3);
}

/* BUTTONS */
button {
    display: block;
    width: 100%;
    min-height: 47px;
    padding: 12px;
    margin: 12px 0;
    border: none;
    border-radius: 9px;
    background: #00f7ff;
    color: #063b52;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: white;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0,247,255,0.3);
}

/* REGISTER LINK */
.register-link {
    text-align: center;
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid rgba(255,255,255,0.2);
    font-size: 14px;
    color: white;
    line-height: 1.6;
}

.register-link a {
    display: inline-block;
    margin-top: 8px;
    padding: 9px 17px;
    color: #003b59;
    background: #00f7ff;
    border-radius: 25px;
    font-weight: 800;
    text-decoration: none;
    transition: 0.3s;
}

.register-link a:hover {
    background: white;
    transform: scale(1.04);
}

/* WELCOME */
.welcome {
    text-align: center;
    margin: 20px auto;
    padding: 15px;
    font-size: 23px;
    font-weight: bold;
    color: #00f7ff;
    text-shadow: 0 0 12px #00f7ff;
}

/* DASHBOARD */
.dashboard {
    display: none;
    padding: 20px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
    gap: 18px;
    margin-top: 20px;
}

.card {
    background: rgba(255,255,255,0.10);
    padding: 20px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.15);
    overflow-wrap: anywhere;
}

.card h3 {
    color: #00f7ff;
    margin-bottom: 15px;
}

.user-item {
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.2);
    line-height: 1.6;
}

.deleteBtn {
    background: #ff4d4d;
    color: white;
    min-height: 36px;
    padding: 8px;
    margin-top: 8px;
}

.logout {
    background: #e53935;
    color: white;
    max-width: 300px;
    margin: 30px auto;
}

.empty {
    color: #cbd5e1;
    font-size: 14px;
}

/* MOBILE */
@media(max-width:480px) {
    .topbar {
        justify-content: flex-start;
        padding: 10px 16px;
    }

    .container {
        margin: 25px auto;
        padding: 22px 18px;
    }

    h2 {
        font-size: 23px;
    }

    .logo {
        font-size: 22px;
    }

    .logo img {
        height: 44px;
        width: 44px;
    }

    .dashboard {
        padding: 12px;
    }
}
</style>
</head>

<body>

<div id="particles-js"></div>

<!-- CLICKABLE AMIGOS LOGO -->
<header class="topbar">
    <a href="index.html" class="logo">
        <img src="images/brand.png" alt="AMIGOS Brand Logo">
        <span>AMIGOS</span>
    </a>
</header>

<!-- LOGIN BOX -->
<div class="container" id="loginBox">

    <h2>AMIGOS Login</h2>

    <select id="role">
        <option value="">Select Role</option>
        <option value="admin">Admin</option>
        <option value="distributor">Distributor</option>
        <option value="retailer">Retailer</option>
    </select>

    <input
        type="tel"
        id="mobile"
        placeholder="Enter Mobile Number"
        maxlength="10"
        inputmode="numeric"
        autocomplete="tel"
    >

    <button type="button" onclick="sendOTP()">Send OTP</button>

    <input
        type="text"
        id="otp"
        placeholder="Enter OTP"
        maxlength="6"
        inputmode="numeric"
        autocomplete="one-time-code"
    >

    <button type="button" onclick="login()">Login</button>

    <div class="register-link">
        Don't have an account?
        <br>
        Join AMIGOS today!
        <br>
        <a href="signup.html">Create Account – Register Free</a>
    </div>

</div>

<!-- ADMIN DASHBOARD -->
<div class="dashboard" id="dashboard"></div>

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

<script>
/* PARTICLES */
if (typeof particlesJS !== "undefined") {
    particlesJS("particles-js", {
        particles: {
            number: { value: 60 },
            color: { value: "#00f7ff" },
            shape: { type: "circle" },
            opacity: { value: 0.5 },
            size: { value: 3 },
            line_linked: {
                enable: true,
                color: "#00f7ff"
            },
            move: {
                enable: true,
                speed: 2
            }
        }
    });
}

/* ELEMENTS */
const loginBox = document.getElementById("loginBox");
const dashboard = document.getElementById("dashboard");
const roleInput = document.getElementById("role");
const mobileInput = document.getElementById("mobile");
const otpInput = document.getElementById("otp");

/* SETTINGS */
let generatedOTP = "";
let otpExpiry = 0;

const adminNumbers = [
    "9146466898",
    "8600051765"
];

/* GET USERS */
function getUsers() {
    try {
        return JSON.parse(localStorage.getItem("users")) || [];
    } catch (error) {
        return [];
    }
}

/* SEND OTP - DEMO VERSION */
function sendOTP() {

    const roleValue = roleInput.value;
    const mobileValue = mobileInput.value.trim();

    if (!roleValue) {
        alert("Please select your role.");
        return;
    }

    if (!/^[0-9]{10}$/.test(mobileValue)) {
        alert("Please enter a valid 10-digit mobile number.");
        return;
    }

    if (roleValue === "admin") {

        if (!adminNumbers.includes(mobileValue)) {
            alert("This mobile number is not an authorized Admin number.");
            return;
        }

    } else {

        const users = getUsers();

        const user = users.find(u =>
            String(u.mobile) === mobileValue &&
            u.role === roleValue
        );

        if (!user) {
            alert("Registration required. Please sign up for free and join AMIGOS!");
            return;
        }

        if (roleValue === "distributor" &&
            user.status !== "approved" &&
            user.approved !== true) {

            alert("Your Distributor registration is awaiting Admin approval.");
            return;
        }

        if (user.status === "rejected") {
            alert("Your registration has been rejected. Please contact Admin.");
            return;
        }
    }

    generatedOTP = String(
        Math.floor(1000 + Math.random() * 9000)
    );

    otpExpiry = Date.now() + 5 * 60 * 1000;

    alert("DEMO OTP: " + generatedOTP +
          "\nThis is a testing OTP, not an SMS.");

    otpInput.value = "";
}

/* LOGIN */
function login() {

    const roleValue = roleInput.value;
    const mobileValue = mobileInput.value.trim();
    const enteredOTP = otpInput.value.trim();

    if (!roleValue || !mobileValue || !enteredOTP) {
        alert("Please complete all login fields.");
        return;
    }

    if (!generatedOTP ||
        Date.now() > otpExpiry ||
        enteredOTP !== generatedOTP) {

        alert("Invalid or expired OTP. Please request a new OTP.");

        otpInput.value = "";
        generatedOTP = "";
        return;
    }

    generatedOTP = "";
    otpExpiry = 0;
    otpInput.value = "";

    /* ADMIN LOGIN */
    if (roleValue === "admin") {

        if (!adminNumbers.includes(mobileValue)) {
            alert("Unauthorized Admin.");
            return;
        }

        sessionStorage.setItem("adminLoggedIn", "true");

        showAdmin();
        return;
    }

    /* USER LOGIN */
    const users = getUsers();

    const user = users.find(u =>
        String(u.mobile) === mobileValue &&
        u.role === roleValue
    );

    if (!user) {
        alert("Registration required. Please register for free.");
        return;
    }

    if (roleValue === "distributor" &&
        user.status !== "approved" &&
        user.approved !== true) {

        alert("Distributor approval is pending.");
        return;
    }

    if (user.status === "rejected") {
        alert("Your registration has been rejected.");
        return;
    }

    localStorage.setItem("loggedUser", JSON.stringify(user));

    alert("Welcome " + user.name + "!");

    window.location.href = "index.html";
}

/* SAFE TEXT */
function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, function(char) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[char];
    });
}

/* ADMIN DASHBOARD */
function showAdmin() {
/* ADMIN DASHBOARD */
function showAdmin() {

    loginBox.style.display = "none";
    dashboard.style.display = "block";

    const users = getUsers();

    const distributors = users.filter(u =>
        u.role === "distributor"
    );

    const retailers = users.filter(u =>
        u.role === "retailer"
    );

    const pendingCount = distributors.filter(u =>
        u.status !== "approved" && u.approved !== true
    ).length;

    let html = `
        <div class="welcome">
            AMIGOS Admin Dashboard
        </div>

        <div class="grid">

            <div class="card">
                <h3>Distributor Management (${distributors.length})</h3>
                <p>Pending Approval: <b>${pendingCount}</b></p>
    `;

    if (distributors.length === 0) {
        html += `<p class="empty">No distributors registered.</p>`;
    }

    distributors.forEach(u => {

        const isApproved =
            u.status === "approved" || u.approved === true;

        const status = isApproved ? "Approved" :
            u.status === "rejected" ? "Rejected" : "Pending";

        html += `
            <div class="user-item">
                <b>${escapeHTML(u.name)}</b><br>
                Mobile: ${escapeHTML(u.mobile)}<br>
                Status: <b>${status}</b><br>

                ${
                    !isApproved && u.status !== "rejected"
                    ? `<button type="button"
                         style="background:#16a34a;color:white;"
                         onclick="approveDistributor('${escapeHTML(u.mobile)}')">
                         ✓ Approve Distributor
                       </button>`
                    : ""
                }

                ${
                    isApproved
                    ? `<button type="button"
                         style="background:#64748b;color:white;"
                         onclick="revokeDistributor('${escapeHTML(u.mobile)}')">
                         Revoke Approval
                       </button>`
                    : ""
                }

                <button type="button" class="deleteBtn"
                    onclick="deleteUser('${escapeHTML(u.mobile)}','distributor')">
                    Delete User
                </button>
            </div>
        `;
    });

    html += `
            </div>

            <div class="card">
                <h3>Retailers (${retailers.length})</h3>
    `;

    if (retailers.length === 0) {
        html += `<p class="empty">No retailers registered.</p>`;
    }

    retailers.forEach(u => {
        html += `
            <div class="user-item">
                <b>${escapeHTML(u.name)}</b><br>
                Mobile: ${escapeHTML(u.mobile)}<br>
                Status: ${escapeHTML(u.status || "Registered")}

                <button class="deleteBtn"
                    onclick="deleteUser('${escapeHTML(u.mobile)}','retailer')">
                    Delete User
                </button>
            </div>
        `;
    });

    html += `
            </div>
        </div>

        <button class="logout" onclick="logout()">
            Logout
        </button>
    `;

    dashboard.innerHTML = html;
}
    html += `
            </div>

            <div class="card">
                <h3>Retailers (${retailers.length})</h3>
    `;

    if (retailers.length === 0) {
        html += `<p class="empty">No retailers registered.</p>`;
    }

    retailers.forEach(u => {
        html += `
            <div class="user-item">
                <b>${escapeHTML(u.name)}</b><br>
                Mobile: ${escapeHTML(u.mobile)}<br>
                Status: ${escapeHTML(u.status || "Registered")}
                <button class="deleteBtn"
                    onclick="deleteUser('${escapeHTML(u.mobile)}','retailer')">
                    Delete User
                </button>
            </div>
        `;
    });

    html += `
            </div>
        </div>

        <button class="logout" onclick="logout()">
            Logout
        </button>
    `;

    dashboard.innerHTML = html;
}

/* DELETE USER */
function deleteUser(mobileNum, userRole) {

    if (!confirm("Are you sure you want to delete this user?")) {
        return;
    }

    if (!confirm("This action cannot be undone. Confirm delete?")) {
        return;
    }

    let users = getUsers();

    users = users.filter(u =>
        !(String(u.mobile) === String(mobileNum) &&
          u.role === userRole)
    );

    localStorage.setItem("users", JSON.stringify(users));

    showAdmin();
}

/* LOGOUT */
function logout() {

    sessionStorage.removeItem("adminLoggedIn");

    window.location.href = "login.html";
}
</script>

</body>
</html>
