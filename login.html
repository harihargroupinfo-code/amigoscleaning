```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMIGOS | Login Portal</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color: white;
    overflow-x: hidden;
}

#particles-js {
    position: fixed;
    inset: 0;
    z-index: -1;
}

/* HEADER */
.topbar {
    display: flex;
    justify-content: flex-start;
    align-items: center;
    padding: 13px 22px;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.12);
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 25px;
    font-weight: bold;
    letter-spacing: 2px;
    text-decoration: none;
    color: white;
    animation: glow 2s infinite alternate;
}

.logo img {
    height: 48px;
    width: 48px;
    object-fit: contain;
}

@keyframes glow {
    from {
        color: #00f7ff;
        text-shadow: 0 0 5px #00f7ff;
    }
    to {
        color: white;
        text-shadow: 0 0 20px #00f7ff;
    }
}

/* LOGIN BOX */
.container {
    width: calc(100% - 32px);
    max-width: 420px;
    margin: 45px auto;
    background: rgba(255,255,255,0.10);
    padding: 28px;
    border-radius: 18px;
    backdrop-filter: blur(15px);
    box-shadow: 0 0 25px rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.15);
    animation: appear 0.7s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

h2 {
    text-align: center;
    margin-bottom: 22px;
    font-size: 27px;
    animation: glow 2s infinite alternate;
}

/* INPUTS */
input, select {
    display: block;
    width: 100%;
    height: 48px;
    padding: 0 14px;
    margin: 12px 0;
    border-radius: 9px;
    border: 1px solid rgba(255,255,255,0.3);
    outline: none;
    font-size: 15px;
    background: white;
    color: #12344a;
}

input:focus, select:focus {
    border: 2px solid #00e5ff;
    box-shadow: 0 0 10px rgba(0,247,255,0.3);
}

/* BUTTONS */
button {
    display: block;
    width: 100%;
    min-height: 45px;
    padding: 11px;
    margin: 12px 0;
    border: none;
    border-radius: 9px;
    background: #00f7ff;
    color: #063b52;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    filter: brightness(1.12);
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0,247,255,0.3);
}

/* REGISTER LINK */
.register-link {
    text-align: center;
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid rgba(255,255,255,0.2);
    font-size: 14px;
    line-height: 1.6;
}

.register-link a {
    display: inline-block;
    margin-top: 8px;
    padding: 9px 17px;
    color: #003b59;
    background: #00f7ff;
    border-radius: 25px;
    font-weight: 800;
    text-decoration: none;
}

/* DASHBOARD */
.dashboard {
    display: none;
    padding: 20px;
}

.welcome {
    text-align: center;
    margin: 20px auto;
    padding: 15px;
    font-size: 25px;
    font-weight: bold;
    color: #00f7ff;
    text-shadow: 0 0 12px #00f7ff;
}

.stats {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(150px,1fr));
    gap: 15px;
    max-width: 1000px;
    margin: 20px auto;
}

.stat-card {
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 18px;
    text-align: center;
}

.stat-card h2 {
    color: #00f7ff;
    margin: 0 0 8px;
}

.stat-card p {
    color: #e2e8f0;
    font-size: 13px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(280px,1fr));
    gap: 18px;
    max-width: 1200px;
    margin: 20px auto;
}

.card {
    background: rgba(255,255,255,0.10);
    padding: 20px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.15);
    overflow-wrap: anywhere;
}

.card h3 {
    color: #00f7ff;
    margin-bottom: 15px;
}

.user-item {
    padding: 14px 0;
    border-bottom: 1px solid rgba(255,255,255,0.2);
    line-height: 1.7;
}

.status {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    margin-top: 5px;
}

.pending {
    background: #fef3c7;
    color: #92400e;
}

.approved {
    background: #dcfce7;
    color: #166534;
}

.rejected {
    background: #fee2e2;
    color: #991b1b;
}

.approveBtn {
    background: #16a34a;
    color: white;
}

.revokeBtn {
    background: #64748b;
    color: white;
}

.rejectBtn {
    background: #ea580c;
    color: white;
}

.deleteBtn {
    background: #dc2626;
    color: white;
}

.logout {
    background: #e53935;
    color: white;
    max-width: 300px;
    margin: 30px auto;
}

.empty {
    color: #cbd5e1;
    font-size: 14px;
    padding: 10px 0;
}

@media(max-width:480px) {
    .topbar {
        padding: 10px 16px;
    }

    .logo {
        font-size: 22px;
    }

    .logo img {
        height: 44px;
        width: 44px;
    }

    .container {
        margin: 25px auto;
        padding: 22px 18px;
    }

    h2 {
        font-size: 23px;
    }

    .dashboard {
        padding: 12px;
    }
}
</style>
</head>

<body>

<div id="particles-js"></div>

<!-- AMIGOS LOGO: CLICK TO GO HOME -->
<header class="topbar">
    <a href="index.html" class="logo">
        <img src="images/brand.png" alt="AMIGOS Logo">
        <span>AMIGOS</span>
    </a>
</header>

<!-- LOGIN -->
<div class="container" id="loginBox">

    <h2>AMIGOS Login</h2>

    <select id="role">
        <option value="">Select Role</option>
        <option value="admin">Admin</option>
        <option value="distributor">Distributor</option>
        <option value="retailer">Retailer</option>
    </select>

    <input
        type="tel"
        id="mobile"
        placeholder="Enter Mobile Number"
        maxlength="10"
        inputmode="numeric"
        autocomplete="tel"
    >

    <button type="button" onclick="sendOTP()">
        Send OTP
    </button>

    <input
        type="text"
        id="otp"
        placeholder="Enter OTP"
        maxlength="6"
        inputmode="numeric"
        autocomplete="one-time-code"
    >

    <button type="button" onclick="login()">
        Login
    </button>

    <div class="register-link">
        Don't have an account?
        <br>
        Join AMIGOS today!
        <br>
        <a href="signup.html">Create Account – Register Free</a>
    </div>

</div>

<!-- ADMIN DASHBOARD -->
<div class="dashboard" id="dashboard"></div>

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

<script>

/* PARTICLES */
if (typeof particlesJS !== "undefined") {
    particlesJS("particles-js", {
        particles: {
            number: { value: 60 },
            color: { value: "#00f7ff" },
            shape: { type: "circle" },
            opacity: { value: 0.5 },
            size: { value: 3 },
            line_linked: {
                enable: true,
                color: "#00f7ff"
            },
            move: {
                enable: true,
                speed: 2
            }
        }
    });
}

/* ELEMENTS */
const loginBox = document.getElementById("loginBox");
const dashboard = document.getElementById("dashboard");
const roleInput = document.getElementById("role");
const mobileInput = document.getElementById("mobile");
const otpInput = document.getElementById("otp");

/* SETTINGS */
let generatedOTP = "";
let otpExpiry = 0;

const adminNumbers = [
    "9146466898",
    "8600051765"
];

/* GET USERS */
function getUsers() {
    try {
        const users = JSON.parse(localStorage.getItem("users"));
        return Array.isArray(users) ? users : [];
    } catch (error) {
        return [];
    }
}

/* SAVE USERS */
function saveUsers(users) {
    localStorage.setItem("users", JSON.stringify(users));
}

/* SEND OTP - DEMO ONLY */
function sendOTP() {

    const roleValue = roleInput.value;
    const mobileValue = mobileInput.value.trim();

    if (!roleValue) {
        alert("Please select your role.");
        return;
    }

    if (!/^[0-9]{10}$/.test(mobileValue)) {
        alert("Please enter a valid 10-digit mobile number.");
        return;
    }

    if (roleValue === "admin") {

        if (!adminNumbers.includes(mobileValue)) {
            alert("This mobile number is not an authorized Admin number.");
            return;
        }

    } else {

        const users = getUsers();

        const user = users.find(u =>
            String(u.mobile) === mobileValue &&
            u.role === roleValue
        );

        if (!user) {
            alert("Registration required. Please sign up for free!");
            return;
        }

        if (user.status === "rejected") {
            alert("Your registration has been rejected. Please contact Admin.");
            return;
        }

        if (
            roleValue === "distributor" &&
            user.status !== "approved" &&
            user.approved !== true
        ) {
            alert("Your Distributor registration is awaiting Admin approval.");
            return;
        }
    }

    generatedOTP = String(
        Math.floor(1000 + Math.random() * 9000)
    );

    otpExpiry = Date.now() + 5 * 60 * 1000;

    alert(
        "DEMO OTP: " + generatedOTP +
        "\nThis is a testing OTP, not an SMS."
    );

    otpInput.value = "";
}

/* LOGIN */
function login() {

    const roleValue = roleInput.value;
    const mobileValue = mobileInput.value.trim();
    const enteredOTP = otpInput.value.trim();

    if (!roleValue || !mobileValue || !enteredOTP) {
        alert("Please complete all login fields.");
        return;
    }

    if (!/^[0-9]{10}$/.test(mobileValue)) {
        alert("Please enter a valid 10-digit mobile number.");
        return;
    }

    if (
        !generatedOTP ||
        Date.now() > otpExpiry ||
        enteredOTP !== generatedOTP
    ) {
        alert("Invalid or expired OTP. Please request a new OTP.");
        otpInput.value = "";
        generatedOTP = "";
        return;
    }

    generatedOTP = "";
    otpExpiry = 0;
    otpInput.value = "";

    /* ADMIN LOGIN */
    if (roleValue === "admin") {

        if (!adminNumbers.includes(mobileValue)) {
            alert("Unauthorized Admin.");
            return;
        }

        sessionStorage.setItem("adminLoggedIn", "true");
        showAdmin();
        return;
    }

    /* USER LOGIN */
    const users = getUsers();

    const user = users.find(u =>
        String(u.mobile) === mobileValue &&
        u.role === roleValue
    );

    if (!user) {
        alert("Registration required. Please register for free.");
        return;
    }

    if (user.status === "rejected") {
        alert("Your registration has been rejected.");
        return;
    }

    if (
        roleValue === "distributor" &&
        user.status !== "approved" &&
        user.approved !== true
    ) {
        alert("Distributor approval is pending.");
        return;
    }

    localStorage.setItem("loggedUser", JSON.stringify(user));

    alert("Welcome " + user.name + "!");

    window.location.href = "index.html";
}

/* SAFE HTML */
function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, function(char) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[char];
    });
}

/* ADMIN DASHBOARD */
function showAdmin() {

    if (sessionStorage.getItem("adminLoggedIn") !== "true") {
        alert("Please login as Admin.");
        window.location.href = "login.html";
        return;
    }

    loginBox.style.display = "none";
    dashboard.style.display = "block";

    const users = getUsers();

    const distributors = users.filter(u =>
        u.role === "distributor"
    );

    const retailers = users.filter(u =>
        u.role === "retailer"
    );

    const pendingCount = distributors.filter(u =>
        u.status !== "approved" &&
        u.approved !== true &&
        u.status !== "rejected"
    ).length;

    const approvedCount = distributors.filter(u =>
        u.status === "approved" || u.approved === true
    ).length;

    const rejectedCount = distributors.filter(u =>
        u.status === "rejected"
    ).length;

    let html = `
        <div class="welcome">
            AMIGOS Admin Dashboard
        </div>

        <div class="stats">

            <div class="stat-card">
                <h2>${distributors.length}</h2>
                <p>Total Distributors</p>
            </div>

            <div class="stat-card">
                <h2>${pendingCount}</h2>
                <p>Pending Approval</p>
            </div>

            <div class="stat-card">
                <h2>${approvedCount}</h2>
                <p>Approved Distributors</p>
            </div>

            <div class="stat-card">
                <h2>${retailers.length}</h2>
                <p>Total Retailers</p>
            </div>

        </div>

        <div class="grid">

            <div class="card">
                <h3>Distributor Management</h3>
                <p>Pending: ${pendingCount} | Approved: ${approvedCount} | Rejected: ${rejectedCount}</p>
    `;

    if (distributors.length === 0) {
        html += `
            <p class="empty">No distributors registered yet.</p>
        `;
    }

    distributors.forEach(u => {

        const isApproved =
            u.status === "approved" || u.approved === true;

        const isRejected = u.status === "rejected";

        let statusText = "Pending";
        let statusClass = "pending";

        if (isApproved) {
            statusText = "Approved";
            statusClass = "approved";
        } else if (isRejected) {
            statusText = "Rejected";
            statusClass = "rejected";
        }

        html += `
            <div class="user-item">

                <b>${escapeHTML(u.name)}</b><br>

                Mobile: ${escapeHTML(u.mobile)}<br>

                Status:
                <span class="status ${statusClass}">
                    ${statusText}
                </span>

                ${
                    !isApproved
                    ? `
                        <button
                            type="button"
                            class="approveBtn"
                            onclick="approveDistributor('${escapeHTML(u.mobile)}')">
                            ✓ Approve Distributor
                        </button>
                    `
                    : `
                        <button
                            type="button"
                            class="revokeBtn"
                            onclick="revokeDistributor('${escapeHTML(u.mobile)}')">
                            Revoke Approval
                        </button>
                    `
                }

                ${
                    !isRejected
                    ? `
                        <button
                            type="button"
                            class="rejectBtn"
                            onclick="rejectDistributor('${escapeHTML(u.mobile)}')">
                            Reject Distributor
                        </button>
                    `
                    : ""
                }

                <button
                    type="button"
                    class="deleteBtn"
                    onclick="deleteUser('${escapeHTML(u.mobile)}','distributor')">
                    Delete Distributor
                </button>

            </div>
        `;
    });

    html += `
            </div>

            <div class="card">
                <h3>Retailer Management</h3>
    `;

    if (retailers.length === 0) {
        html += `
            <p class="empty">No retailers registered yet.</p>
        `;
    }

    retailers.forEach(u => {

        html += `
            <div class="user-item">

                <b>${escapeHTML(u.name)}</b><br>

                Mobile: ${escapeHTML(u.mobile)}<br>

                Status: ${escapeHTML(u.status || "Registered")}

                <button
                    type="button"
                    class="deleteBtn"
                    onclick="deleteUser('${escapeHTML(u.mobile)}','retailer')">
                    Delete Retailer
                </button>

            </div>
        `;
    });

    html += `
            </div>

        </div>

        <button class="logout" onclick="logout()">
            Logout
        </button>
    `;

    dashboard.innerHTML = html;
}

/* APPROVE DISTRIBUTOR */
function approveDistributor(mobileNum) {

    if (!confirm("Are you sure you want to approve this distributor?")) {
        return;
    }

    const users = getUsers();

    const user = users.find(u =>
        String(u.mobile) === String(mobileNum) &&
        u.role === "distributor"
    );

    if (!user) {
        alert("Distributor not found.");
        return;
    }

    user.status = "approved";
    user.approved = true;

    saveUsers(users);

    alert(user.name + " has been approved successfully!");

    showAdmin();
}

/* REVOKE APPROVAL */
function revokeDistributor(mobileNum) {

    if (!confirm("Do you want to revoke this distributor's approval?")) {
        return;
    }

    const users = getUsers();

    const user = users.find(u =>
        String(u.mobile) === String(mobileNum) &&
        u.role === "distributor"
    );

    if (!user) {
        alert("Distributor not found.");
        return;
    }

    user.status = "pending";
    user.approved = false;

    saveUsers(users);

    alert("Distributor approval has been revoked.");

    showAdmin();
}

/* REJECT DISTRIBUTOR */
function rejectDistributor(mobileNum) {

    if (!confirm("Are you sure you want to reject this distributor?")) {
        return;
    }

    const users = getUsers();

    const user = users.find(u =>
        String(u.mobile) === String(mobileNum) &&
        u.role === "distributor"
    );

    if (!user) {
        alert("Distributor not found.");
        return;
    }

    user.status = "rejected";
    user.approved = false;

    saveUsers(users);

    alert("Distributor registration rejected.");

    showAdmin();
}

/* DELETE USER */
function deleteUser(mobileNum, userRole) {

    if (!confirm("Are you sure you want to delete this user?")) {
        return;
    }

    if (!confirm("This action cannot be undone. Confirm delete?")) {
        return;
    }

    let users = getUsers();

    users = users.filter(u =>
        !(String(u.mobile) === String(mobileNum) &&
          u.role === userRole)
    );

    saveUsers(users);

    alert("User deleted successfully.");

    showAdmin();
}

/* LOGOUT */
function logout() {

    sessionStorage.removeItem("adminLoggedIn");

    window.location.href = "login.html";
}

</script>

</body>
</html>
```
