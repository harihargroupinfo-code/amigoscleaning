```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMIGOS | Sign Up</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #020617, #0f2742, #164e63);
    color: white;
}

/* TOP BAR */
.topbar {
    width: 100%;
    min-height: 75px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding: 12px 25px;
    background: rgba(0,0,0,0.35);
    border-bottom: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(10px);
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: white;
    font-size: 25px;
    font-weight: bold;
    letter-spacing: 2px;
    text-shadow: 0 0 12px #38bdf8;
}

.logo img {
    width: 48px;
    height: 48px;
    object-fit: contain;
}

/* MAIN AREA */
.main {
    min-height: calc(100vh - 75px);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 35px 16px;
}

/* SIGNUP CARD */
.card {
    width: 100%;
    max-width: 440px;
    padding: 35px 32px;
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 20px;
    backdrop-filter: blur(15px);
    box-shadow: 0 15px 45px rgba(0,0,0,0.35);
    animation: appear 0.7s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.heading {
    text-align: center;
    margin-bottom: 10px;
}

.heading h1 {
    font-size: 29px;
    color: #38bdf8;
    margin-bottom: 9px;
}

.heading p {
    color: #dbeafe;
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 25px;
}

/* FORM */
.form-group {
    margin-bottom: 17px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: bold;
    color: #e0f2fe;
}

.input-field {
    display: block;
    width: 100%;
    height: 49px;
    padding: 0 14px;
    border: 1px solid #cbd5e1;
    border-radius: 9px;
    outline: none;
    background: #ffffff;
    color: #12344a;
    font-size: 15px;
}

.input-field:focus {
    border: 2px solid #38bdf8;
    box-shadow: 0 0 12px rgba(56,189,248,0.3);
}

.input-field::placeholder {
    color: #64748b;
}

/* REGISTER BUTTON */
.register-btn {
    width: 100%;
    height: 50px;
    margin-top: 8px;
    border: none;
    border-radius: 9px;
    background: linear-gradient(90deg, #38bdf8, #06b6d4);
    color: #082f49;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.register-btn:hover {
    background: white;
    transform: translateY(-2px);
    box-shadow: 0 7px 18px rgba(56,189,248,0.25);
}

/* LOGIN LINK */
.login-link {
    text-align: center;
    margin-top: 24px;
    padding-top: 19px;
    border-top: 1px solid rgba(255,255,255,0.2);
    font-size: 14px;
    color: #e2e8f0;
    line-height: 1.8;
}

.login-link a {
    color: #38bdf8;
    font-weight: bold;
    text-decoration: none;
}

.login-link a:hover {
    color: white;
    text-decoration: underline;
}

.footer-note {
    text-align: center;
    color: #94a3b8;
    font-size: 11px;
    margin-top: 20px;
}

/* MOBILE */
@media(max-width:480px) {
    .topbar {
        padding: 10px 16px;
    }

    .logo {
        font-size: 21px;
    }

    .logo img {
        width: 43px;
        height: 43px;
    }

    .main {
        padding: 25px 14px;
    }

    .card {
        padding: 28px 21px;
        border-radius: 16px;
    }

    .heading h1 {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<!-- AMIGOS LOGO: CLICK TO GO HOME -->
<header class="topbar">
    <a href="index.html" class="logo">
        <img src="images/brand.png" alt="AMIGOS Brand Logo">
        <span>AMIGOS</span>
    </a>
</header>

<main class="main">

    <div class="card">

        <div class="heading">
            <h1>Join AMIGOS</h1>
            <p>Create your free account and become a part of our growing business network.</p>
        </div>

        <form id="signupForm" onsubmit="register(event)">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    class="input-field"
                    placeholder="Enter your full name"
                    maxlength="60"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="mobile">Mobile Number</label>
                <input
                    type="tel"
                    id="mobile"
                    class="input-field"
                    placeholder="Enter 10-digit mobile number"
                    maxlength="10"
                    inputmode="numeric"
                    autocomplete="tel"
                    pattern="[0-9]{10}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="role">Register As</label>
                <select id="role" class="input-field" required>
                    <option value="distributor">Distributor</option>
                    <option value="retailer">Retailer</option>
                </select>
            </div>

            <button type="submit" class="register-btn">
                Register Free
            </button>

        </form>

        <div class="login-link">
            Already registered with AMIGOS?
            <br>
            <a href="login.html">Login Here →</a>
        </div>

        <div class="footer-note">
            AMIGOS | A Product by Harihar Group of Industries
        </div>

    </div>

</main>

<script>
function register(event) {

    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const mobile = document.getElementById("mobile").value.trim();
    const role = document.getElementById("role").value;

    if (!name || !mobile) {
        alert("Please fill all the fields.");
        return;
    }

    if (!/^[0-9]{10}$/.test(mobile)) {
        alert("Please enter a valid 10-digit mobile number.");
        return;
    }

    let users = [];

    try {
        users = JSON.parse(localStorage.getItem("users")) || [];
    } catch (error) {
        alert("Unable to read registration data. Please try again.");
        return;
    }

    if (users.find(u => String(u.mobile) === mobile)) {
        alert("This mobile number is already registered!");
        return;
    }

    const status = role === "distributor" ? "pending" : "approved";

    users.push({
        name: name,
        mobile: mobile,
        role: role,
        status: status
    });

    localStorage.setItem("users", JSON.stringify(users));

    if (role === "distributor") {
        alert("Thank you for registering with AMIGOS!\nYour Distributor request is pending Admin approval.");
    } else {
        alert("Registration successful!\nYou can now login to AMIGOS.");
    }

    window.location.href = "login.html";
}
</script>

</body>
</html>
